[project]
name = "deploylens-backend"
version = "0.1.0"
requires-python = ">=3.12"

# The serverless build reads this table rather than requirements.txt, and a
# [project] table with no dependencies installs nothing at all — the function then
# fails to import FastAPI. Kept in step with requirements.txt, which is still what
# local development and CI install from.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "SQLAlchemy",
    "alembic",
    "psycopg[binary]",
    "PyJWT",
    "cryptography",
    "httpx",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"
