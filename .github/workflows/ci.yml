name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    # Migrations run against a throwaway Postgres rather than Neon, so a broken
    # migration on a branch can never touch real data. Version matches production.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deploylens
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install dependencies
        run: pip install -r requirements.lock.txt

      - name: Lint
        run: ruff check app migrations tests

      - name: Check formatting
        run: ruff format --check app migrations tests

      - name: Type check
        run: mypy app

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deploylens
        run: alembic upgrade head

      - name: Check models match migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deploylens
        run: alembic check

      # Throwaway secrets: the suite needs a valid Fernet key and a signing key, but
      # never talks to GitHub — respx intercepts those calls.
      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deploylens
          SESSION_SECRET: ci-session-secret
          TOKEN_ENCRYPTION_KEY: Spbw1tFaTMoOEPbHSYTbiIbXcujUBbayNxTTOtASKjY=
          APP_URL: http://localhost:3000
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
