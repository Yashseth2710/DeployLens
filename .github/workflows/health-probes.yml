name: Health probes

# Vercel's Hobby plan runs cron once a day, which is too coarse to call uptime
# monitoring. Actions schedules are free and run hourly, so the schedule lives here
# and the app only exposes the endpoint it calls.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Probe every due endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET are not configured yet; nothing to probe."
            exit 0
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --max-time 120 \
            --request POST "$APP_URL/api/cron/health-check" \
            --header "Authorization: Bearer $CRON_SECRET")

          echo "$response"
