name: Scheduled collection

# Vercel's Hobby plan runs cron once a day, which is too coarse to call monitoring.
# Actions schedules are free and run hourly, so the schedule lives here and the app
# only exposes the endpoints it calls.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Probe every due endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET are not configured yet; nothing to probe."
            exit 0
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --max-time 120 \
            --request POST "$APP_URL/api/cron/health-check" \
            --header "Authorization: Bearer $CRON_SECRET")

          echo "$response"

      # Webhooks keep a repository current while somebody is watching. This is for the
      # hours when nobody is: without it, a project is only ever as fresh as the last
      # time the page was open.
      - name: Collect runs and deployments
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET are not configured yet; nothing to collect."
            exit 0
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --max-time 300 \
            --request POST "$APP_URL/api/cron/sync" \
            --header "Authorization: Bearer $CRON_SECRET")

          echo "$response"
